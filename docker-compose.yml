version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: restock_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restock_priority
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restock_api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restock_priority?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
