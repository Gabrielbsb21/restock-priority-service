services:
  postgres:
    image: postgres:16-alpine
    container_name: restock_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restock_priority
    # Override POSTGRES_PORT when another PostgreSQL already holds 5432 locally.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration step. The API waits for this to exit successfully, so the
  # schema is always in place before the first request is served.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restock_migrate
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restock_priority?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restock_api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restock_priority?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
